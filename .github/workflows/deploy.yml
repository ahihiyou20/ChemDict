name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, claude/project-thread-8o54e3]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # nuxt generate leaves a .wrangler/deploy redirect pointing at a Worker config; Pages deploy must ignore it
      - run: rm -rf .wrangler/deploy
      # --branch main publishes to the production URL https://chemdict.pages.dev
      - run: npx --yes wrangler@4.152.0 pages deploy .output/public --project-name chemdict --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
